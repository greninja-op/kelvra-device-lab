[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kelvra-device-lab"
version = "1.0.0"
description = "Autonomous mobile device teleoperation, screen streaming, telemetry, and automated testing laboratory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "KELVRA Development Team"}
]
keywords = ["android", "ios", "adb", "usbmuxd", "teleoperation", "webrtc", "testing", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "websockets>=11.0.0",
    "pillow>=9.5.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
kelvra-device-lab = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "static*"]

[tool.setuptools.package-data]
"src" = ["*"]
"static" = ["*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

